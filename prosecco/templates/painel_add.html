<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerenciador de Mídias</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bulma.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
  <script src="{{ url_for('static', filename='css/painel_add.css') }}" defer></script>
  <script src="{{ url_for('static', filename='js/show_control.js') }}" defer></script>
</head>
<body class="has-background-dark has-text-light">
  <section class="section">
    <div class="container">
      <h1 class="title has-text-success">Painel de Mídias</h1>

      <div class="field is-grouped mb-5">
        <div class="control">
          <div class="select">
            <select id="jsonSelect">
              <option disabled selected>Carregando arquivos JSON...</option>
            </select>
          </div>
        </div>
        <div class="control">
          <button id="atribuirBtn" class="button is-success">Atribuir</button>
        </div>
        <div class="control">
          <button id="limparBtn" class="button is-danger">Limpar</button>
        </div>
      </div>

      <div class="columns is-multiline" id="mediaList"></div>
    </div>
  </section>

  <div class="modal" id="mediaModal">
    <div class="modal-background"></div>
    <div class="modal-content">
      <div id="modalContent"></div>
    </div>
    <button class="modal-close is-large" aria-label="close" id="modalClose"></button>
  </div>
</body>
</html>
